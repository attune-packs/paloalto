ref: paloalto.pending_changes
label: "Inspect Pending Changes"
description: "Run only the constrained show config list change-summary operational command"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: paloalto_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, default: pack.paloalto.credentials, required: true}
  target_type: {type: string, enum: [firewall, panorama], required: true}
  timeout_seconds: {type: integer, minimum: 1, maximum: 300, default: 30}
output:
  operation: {type: string}
  target_type: {type: string}
  changed: {type: any}
  data: {type: any}
  meta: {type: object}
tags: [paloalto, configuration, status]
