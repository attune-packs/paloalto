ref: paloalto.service_object_create
label: "Create Service Object"
description: "Create one TCP or UDP service object in candidate configuration"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: paloalto_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, default: paloalto.credentials, required: true}
  target_type: {type: string, enum: [firewall, panorama], required: true}
  scope: {type: string, enum: [local, shared, device_group], required: true}
  device_group: {type: string}
  vsys: {type: string}
  name: {type: string, required: true}
  protocol: {type: string, enum: [tcp, udp], required: true}
  destination_port: {type: string, required: true}
  source_port: {type: string}
  description: {type: string}
  tags: {type: array, items: {type: string}, default: []}
  timeout_seconds: {type: integer, minimum: 1, maximum: 300, default: 30}
output:
  operation: {type: string}
  target_type: {type: string}
  changed: {type: any}
  data: {type: any}
  meta: {type: object}
tags: [paloalto, service, create]
