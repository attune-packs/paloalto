ref: paloalto.security_rule_update
label: "Replace Security Rule"
description: "Fully replace the supported fields of an existing rule after exact-name confirmation"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: paloalto_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, default: pack.paloalto.credentials, required: true}
  target_type: {type: string, enum: [firewall, panorama], required: true}
  scope: {type: string, enum: [local, shared, device_group], required: true}
  device_group: {type: string}
  vsys: {type: string}
  policy_position: {type: string, enum: [local, pre, post], required: true}
  name: {type: string, required: true}
  confirm_name: {type: string, required: true}
  from_zones: {type: array, items: {type: string}, required: true}
  to_zones: {type: array, items: {type: string}, required: true}
  sources: {type: array, items: {type: string}, required: true}
  destinations: {type: array, items: {type: string}, required: true}
  source_users: {type: array, items: {type: string}, default: [any]}
  applications: {type: array, items: {type: string}, required: true}
  services: {type: array, items: {type: string}, required: true}
  categories: {type: array, items: {type: string}, default: [any]}
  action: {type: string, enum: [allow, deny, drop, reset-client, reset-server, reset-both], required: true}
  description: {type: string}
  tags: {type: array, items: {type: string}, default: []}
  disabled: {type: boolean, default: false}
  log_start: {type: boolean, default: false}
  log_end: {type: boolean, default: true}
  log_setting: {type: string}
  profile_group: {type: string}
  schedule: {type: string}
  timeout_seconds: {type: integer, minimum: 1, maximum: 300, default: 30}
output:
  operation: {type: string}
  target_type: {type: string}
  changed: {type: any}
  data: {type: any}
  meta: {type: object}
tags: [paloalto, security-rule, update]
