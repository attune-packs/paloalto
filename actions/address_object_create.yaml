ref: paloalto.address_object_create
label: "Create Address Object"
description: "Create one address object in candidate configuration; fails when it exists"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: paloalto_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, default: paloalto.credentials, required: true}
  target_type: {type: string, enum: [firewall, panorama], required: true}
  scope: {type: string, enum: [local, shared, device_group], required: true}
  device_group: {type: string}
  vsys: {type: string}
  name: {type: string, required: true}
  address_type: {type: string, enum: [ip-netmask, ip-range, fqdn, ip-wildcard-mask], required: true}
  value: {type: string, required: true}
  description: {type: string}
  tags: {type: array, items: {type: string}, default: []}
  timeout_seconds: {type: integer, minimum: 1, maximum: 300, default: 30}
output:
  operation: {type: string}
  target_type: {type: string}
  changed: {type: any}
  data: {type: any}
  meta: {type: object}
tags: [paloalto, address, create]
