ref: paloalto.dynamic_address_register
label: "Register Dynamic Addresses"
description: "Register tags for validated IP hosts or IPv4 sets on a firewall, Panorama, or explicit managed serial"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: paloalto_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, default: pack.paloalto.credentials, required: true}
  target_type: {type: string, enum: [firewall, panorama], required: true}
  managed_device_serial: {type: string, description: "Optional Panorama managed-firewall destination; omit to register on Panorama"}
  ip_addresses: {type: array, items: {type: string}, required: true}
  tags: {type: array, items: {type: string}, required: true}
  registration_timeout_seconds: {type: integer, minimum: 1, maximum: 2592000}
  timeout_seconds: {type: integer, minimum: 1, maximum: 300, default: 30}
output:
  operation: {type: string}
  target_type: {type: string}
  changed: {type: any}
  data: {type: any}
  meta: {type: object}
tags: [paloalto, dynamic-address-group, register]
