ref: paloalto
label: "Palo Alto Networks PAN-OS"
description: "Constrained PAN-OS and Panorama XML API configuration and commit actions"
version: "0.1.0"
author: "Attune; adapted from work by Irek Romaniuk, John Anderson, and StackStorm Exchange contributors"
email: "support@attune.systems"
system: false
enabled: true

conf_schema: {}
config: {}

meta:
  category: integration
  documentation_url: "https://docs.paloaltonetworks.com/ngfw/api"
  repository_url: "https://github.com/attune-packs/paloalto"
  source_revision: "efdc0db1dc96f94c4288a9c2ff227f2c9d0ee05e"
  source_version: "1.0.0"
  license: "Apache-2.0"

tags: [paloalto, pan-os, panorama, firewall, security, integration]
runtime_deps: [python]
dependencies: []

testing:
  enabled: true
  discovery:
    method: directory
    path: tests
  runners:
    python:
      type: unittest
      entry_point: tests/test_pack.py
      timeout: 120
      result_format: simple
  min_pass_rate: 1.0
  on_failure: block
